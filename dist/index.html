/* v5 — structural art direction: open canvas, type and rules instead of stacked cards */
:root{--bg:#ffffff;--ink:#171b25;--line:#e9edf2;--blue:#1769f4}
body{background:#fff}
.topbar{height:76px;background:rgba(255,255,255,.97)}
.top-inner{max-width:1290px}
.logo{letter-spacing:-.105em;font-size:30px}
.logo-dot{color:#2576ff}
.header-add{background:#1769f4;border-radius:10px}
.header-add:hover{background:#0953d4}
.header-right .roundbtn{background:#f5f7f9}
.shell{max-width:1290px;padding:46px 44px 110px}
.page-kicker{font-weight:650;color:#99a1ae;margin-bottom:30px}
.page-kicker .signal{color:#a0a7b1}
.overview-hero{background:none;border-radius:0;min-height:310px;padding:20px 0 39px;grid-template-columns:1.08fr .92fr;gap:76px;border-bottom:1px solid var(--line)}
.hero-left{justify-content:center}
.hero-eyebrow{font-size:16px;color:#808996;margin-bottom:13px;font-weight:650}
.balance-number{font-size:clamp(49px,5.2vw,78px);font-weight:850;letter-spacing:-.083em}
.delta{margin-top:15px;color:#9aa3b0;font-size:12px}
.asset-chip{font-size:11px;background:#eef5ff;color:#3078e9;padding:6px 10px;border-radius:8px;font-weight:750}
.action-row{margin-top:34px}
.btn-primary{background:#1769f4;border-radius:11px}
.btn-primary:hover{background:#0856d7}
.btn-secondary{border-radius:11px;background:#f3f5f7}
.chart-visual{min-height:190px}
.trend-bubble{color:#1c6ef0}
.section-space{height:48px}
.grid-body,.overview-bottom{gap:0;grid-template-columns:minmax(0,1.13fr) minmax(350px,.87fr)}

/* Floating Device Preview Switcher (데스크톱에서 기기별 화면 즉시 전환) */
.device-preview-bar {
  position: fixed;
  top: 14px;
  right: 18px;
  background: rgba(25, 31, 40, 0.94);
  backdrop-filter: blur(12px);
  padding: 4px;
  border-radius: 30px;
  display: flex;
  align-items: center;
  gap: 3px;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  transition: all .2s ease;
}
.device-btn {
  border: none;
  background: none;
  color: #9aa3b0;
  font-size: 11.5px;
  font-weight: 750;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all .15s ease;
}
.device-btn:hover { color: #ffffff; }
.device-btn.active {
  background: #3182f6;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(49,130,246,0.4);
}

.bulk-table-wrap{overflow-x:auto;border:1px solid #e2eae6;border-radius:16px;background:#fff}
.bulk-table{min-width:900px}
.bulk-head,.bulk-row{display:grid;grid-template-columns:120px 84px 110px minmax(130px,1fr) 105px 135px 135px 36px;align-items:center}
.bulk-head{height:39px;background:#f5f8f6;color:#7b8982;font-size:10px;font-weight:850}
.bulk-head span{padding:0 9px}
.bulk-row{min-height:56px;border-top:1px solid #edf1ef}
.bulk-cell{width:100%;height:55px;padding:0 9px;border:0;border-right:1px solid #edf1ef;background:#fff;color:#29372f;font-size:12px;font-weight:650;outline:0;min-width:0}
.bulk-cell:focus{position:relative;z-index:1;background:#f5fbf8;box-shadow:inset 0 0 0 2px #69b58e}
.bulk-cell::placeholder{color:#b3bbb7}
.bulk-cell:disabled{background:#f7f8f8;color:#c1c7c4}
.bulk-remove{width:28px;height:28px;margin:auto;border-radius:9px;background:#f5f6f6;color:#9aa4a0;font-size:17px;line-height:1}
.bulk-remove:hover{background:#fff0f0;color:#e06464}
.bulk-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.bulk-add{padding:9px 13px;border-radius:10px;background:#e9f5ef;color:#32815d;font-size:11px;font-weight:850}
.bulk-footnote{color:#949e99;font-size:10px;line-height:1.55}
@media(max-width:640px){.transaction-sheet{padding:13px 22px calc(24px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0}.transaction-sheet .sheet-kicker{display:none}.transaction-sheet .sheet-top h2{font-size:21px}.transaction-sheet .amount-panel{padding:16px 18px}.transaction-sheet .amount-wrap input{font-size:38px}.transaction-sheet .form-row{grid-template-columns:1fr 1fr;gap:10px}}

<body>
<header class="topbar"><div class="top-inner"><button class="logo" aria-label="moa 홈" style="background:none" onclick="go('home')">moa<span class="logo-dot">.</span></button><nav id="desktopNav" class="desktop-nav" aria-label="주요 메뉴"></nav><div class="header-right">
  <button class="header-add" onclick="openSheet('expense')"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>내역 추가</button><button class="roundbtn" aria-label="설정" title="설정" onclick="openSettings()"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div></div></header>
<main id="main" class="shell"></main>
<nav id="mobileNav" class="mobile-nav" aria-label="모바일 메뉴"></nav>
<div id="dialogRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const UI={home:'홈',transactions:'내역',calendar:'달력',assets:'자산',budget:'예산',insights:'분석'};
const iconShapes={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',transactions:'<path d="M5 5h14M5 12h14M5 19h14"/><circle cx="3" cy="5" r=".7" fill="currentColor"/><circle cx="3" cy="12" r=".7" fill="currentColor"/><circle cx="3" cy="19" r=".7" fill="currentColor"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',assets:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M7 16h3"/>',budget:'<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 5"/>',insights:'<path d="m4 17 5-5 3 3 8-8M15 7h5v5"/>',chevron:'<path d="m9 18 6-6-6-6"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',swap:'<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',coffee:'<path d="M4 8h12v7a6 6 0 0 1-12 0V8ZM16 9h2a3 3 0 0 1 0 6h-2M3 21h15"/>',bag:'<path d="M5 8h14l-1 13H6L5 8ZM9 8V6a3 3 0 0 1 6 0v2"/>',meal:'<path d="M4 3v8a3 3 0 0 0 6 0V3M7 3v18M17 3c-3 4-3 8 0 11v7M4 7h6"/>',bus:'<rect x="5" y="3" width="14" height="17" rx="3"/><path d="M5 12h14M8 17h2m4 0h2M8 20v2m8-2v2"/>',film:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M7 5l3 5m2-5 3 5m2-5 3 5"/>',wallet:'<rect x="3" y="6" width="18" height="15" rx="3"/><path d="M3 10h18M16 15h2"/>',income:'<path d="M12 3v15m-6-6 6 6 6-6M5 21h14"/>',transfer:'<path d="M4 7h16m-5-4 5 4-5 4M20 17H4m5-4-5 4 5 4"/>',close:'<path d="M5 5 19 19M19 5 5 19"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',sparkle:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/>',shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m8 12 3 3 5-5"/>',cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>'};
const ico=(name,cls='')=>`<svg aria-hidden="true" class="icon ${cls}" viewBox="0 0 24 24">${iconShapes[name]||iconShapes.wallet}</svg>`;
const fmt=n=>Math.abs(n).toLocaleString('ko-KR'), money=n=>`${n<0?'-':''}${fmt(n)}원`;
const todayStr='2026-10-31';
const initial={accounts:[{id:'toss',name:'토스뱅크',sub:'입출금 통장',balance:1420000,type:'toss'},{id:'kakao',name:'카카오뱅크',sub:'저축 통장',balance:2850000,type:'kakao'},{id:'cash',name:'현금',sub:'지갑',balance:80000,type:'cash'}],transactions:[{id:1,type:'expense',date:'2026-10-31',name:'오후의 커피',category:'카페',account:'toss',amount:5900,time:'14:25'},{id:2,type:'expense',date:'2026-10-30',name:'점심 식사',category:'식비',account:'toss',amount:13200},{id:3,type:'expense',date:'2026-10-29',name:'시내버스',category:'교통',account:'toss',amount:1650},{id:4,type:'transfer',date:'2026-10-28',name:'저축 통장으로 이동',category:'이체',account:'toss',to:'kakao',amount:300000},{id:5,type:'expense',date:'2026-10-27',name:'영화관',category:'문화',account:'toss',amount:14500},{id:6,type:'expense',date:'2026-10-24',name:'이번 주 장보기',category:'식비',account:'kakao',amount:53600},{id:7,type:'expense',date:'2026-10-23',name:'온라인 쇼핑',category:'쇼핑',account:'toss',amount:43800},{id:8,type:'expense',date:'2026-10-20',name:'휴대폰 요금',category:'고정비',account:'toss',amount:59000},{id:9,type:'expense',date:'2026-10-18',name:'친구들과 저녁',category:'식비',account:'toss',amount:63500},{id:10,type:'expense',date:'2026-10-15',name:'카페',category:'카페',account:'toss',amount:8300},{id:11,type:'expense',date:'2026-10-13',name:'편의점',category:'식비',account:'toss',amount:9800},{id:12,type:'expense',date:'2026-10-10',name:'생필품',category:'쇼핑',account:'kakao',amount:55000},{id:13,type:'expense',date:'2026-10-08',name:'온라인 구독',category:'고정비',account:'toss',amount:14900},{id:14,type:'expense',date:'2026-10-06',name:'외식',category:'식비',account:'toss',amount:43800},{id:15,type:'income',date:'2026-10-05',name:'급여',category:'월급',account:'toss',amount:2400000}],budget:800000};
const clone = x => { try { return structuredClone(x); } catch(e) { return JSON.parse(JSON.stringify(x)); } };
let state;
try { state = JSON.parse(localStorage.getItem('moa_editorial_v4') || 'null'); } catch(e) { state = null; }
if (!state || !Array.isArray(state.accounts) || !Array.isArray(state.transactions) || typeof state.budget !== 'number') {
  state = clone(initial);
  try { localStorage.setItem('moa_editorial_v4', JSON.stringify(state)); } catch(e) {}
}
let view='home', txFilter='all', txQuery='', focusDate='2026-10-31', calendarMonth=9, calendarYear=2026, chartPeriod='1개월', currentSheet='expense';
let store=()=>{try{localStorage.setItem('moa_editorial_v4',JSON.stringify(state))}catch(e){}};
const balance=()=>state.accounts.reduce((n,a)=>n+a.balance,0);
const monthItems=()=>state.transactions.filter(t=>t.date.slice(0,7)==='2026-10');
const expTotal=()=>monthItems().filter(t=>t.type==='expense').reduce((sum,t)=>sum+t.amount,0);
const incTotal=()=>monthItems().filter(t=>t.type==='income').reduce((sum,t)=>sum+t.amount,0);
const remain=()=>state.budget-expTotal();
const expCats=()=>{const o={};monthItems().filter(t=>t.type==='expense').forEach(t=>o[t.category]=(o[t.category]||0)+t.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1]);};
const nameAccount=id=>state.accounts.find(a=>a.id===id)?.name||'계좌';
const escapeHTML=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const symbol=a=>`<span class="bank-symbol ${a.type==='toss'||a.type==='kakao'||a.type==='cash'?a.type:'new'}">${a.type==='toss'?'t':a.type==='kakao'?'K':a.type==='cash'?ico('cash'):ico('wallet')}</span>`;
function nav(){document.getElementById('desktopNav').innerHTML=Object.entries(UI).map(([k,t])=>`<button class="nav-item ${view===k?'active':''}" onclick="go('${k}')" aria-current="${view===k?'page':'false'}">${t}</button>`).join('');let mobileItems=[['home','홈'],['transactions','내역'],['assets','자산'],['insights','분석']];document.getElementById('mobileNav').innerHTML=mobileItems.map(([k,t])=>`<button class="${view===k?'active':''}" onclick="go('${k}')" aria-label="${t}">${ico(k)}<span>${t}</span></button>`).join('')}
function heroChart(){const paths={'1주':'M 0 116 C 45 126 57 58 100 81 S 164 125 206 75 S 285 96 328 41 S 392 80 446 22','1개월':'M 0 138 C 36 137 45 128 74 124 S 127 94 159 107 S 209 85 240 90 S 308 48 335 56 S 392 72 446 21','3개월':'M 0 147 C 44 128 61 156 90 116 S 152 138 190 86 S 236 97 278 61 S 346 89 382 42 S 417 45 446 17'};let path=paths[chartPeriod];let area=path+' L 446 175 L 0 175 Z';return `<div class="hero-chart-area"><div class="chart-head"><span class="chart-title">자산 흐름 <span style="color:#a8aeb7;font-weight:600">· 예시 추이</span></span><div class="time-filter">${['1주','1개월','3개월'].map(p=>`<button class="${chartPeriod===p?'chosen':''}" onclick="chartPeriod='${p}';render()">${p}</button>`).join('')}</div></div><div class="chart-visual"><span class="trend-bubble">↗ 2.8%</span><svg viewBox="0 0 446 175" preserveAspectRatio="none" aria-label="자산 변동 예시 그래프"><defs><linearGradient id="gradientFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#73c79f" stop-opacity=".28"/><stop offset="62%" stop-color="#91bfe8" stop-opacity=".12"/><stop offset="100%" stop-color="#cbb9e8" stop-opacity="0"/></linearGradient><linearGradient id="gradientStroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#72c59d"/><stop offset="55%" stop-color="#79b8e8"/><stop offset="100%" stop-color="#b89cdd"/></linearGradient></defs><path d="${area}" fill="url(#gradientFill)"/><path d="${path}" stroke="url(#gradientStroke)" stroke-width="3.7" stroke-linecap="round" fill="none"/><circle cx="446" cy="${chartPeriod==='3개월'?17:chartPeriod==='1주'?22:21}" r="6" fill="#b89cdd" stroke="white" stroke-width="4"/></svg></div><div class="chart-foot"><span>${chartPeriod==='1주'?'10.25':chartPeriod==='1개월'?'10.01':'08.01'}</span><span>${chartPeriod==='1주'?'10.31':chartPeriod==='1개월'?'10.31':'10.31'}</span></div></div>`}
function accountRows(limit=99){return state.accounts.slice(0,limit).map(a=>`<div class="account-row">${symbol(a)}<div class="bank-copy"><div class="row-main">${escapeHTML(a.name)}</div><div class="row-sub">${escapeHTML(a.sub)}</div></div><div class="row-value">${fmt(a.balance)}<small>원</small></div><button class="row-push" aria-label="${escapeHTML(a.name)}에서 이체" onclick="openSheet('transfer','${a.id}')">${ico('chevron')}</button></div>`).join('')}

function formatTimeKo(timeStr) {
  if (!timeStr) return '';
  const [h, m] = timeStr.split(':').map(Number);
  if (isNaN(h) || isNaN(m)) return timeStr;
  const ampm = h >= 12 ? '오후' : '오전';
  const hour12 = h % 12 || 12;
  return `${ampm} ${hour12}:${String(m).padStart(2, '0')}`;
}
function getCurrentTimeStr() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function txIcon(t){const name=t.type==='transfer'?'transfer':t.type==='income'?'income':({'카페':'coffee','식비':'meal','교통':'bus','쇼핑':'bag','문화':'film','고정비':'wallet'}[t.category]||'wallet');return `<span class="tx-symbol ${t.type==='income'?'income':t.type==='transfer'?'transfer':''}">${ico(name)}</span>`}
function txRows(items,limit=100){return items.slice(0,limit).map(t=>`<div class="tx-row">${txIcon(t)}<div class="tx-copy"><div class="row-main">${escapeHTML(t.name)}</div><div class="row-sub">${escapeHTML(t.type==='transfer'?nameAccount(t.account)+' → '+nameAccount(t.to):t.category+' · '+nameAccount(t.account))}${t.time ? ' · <span style="color:#3182f6;font-weight:600">' + formatTimeKo(t.time) + '</span>' : ''}</div></div><div><div class="tx-amount ${t.type}">${t.type==='transfer'?'이체 ':t.type==='income'?'+':'−'}${fmt(t.amount)}원</div><div class="tx-date">${t.date.slice(5).replace('-','.')}${t.time ? ' ' + t.time : ''}</div></div></div>`).join('')||'<div class="empty">거래 내역이 없어요.</div>'}
function home(){const pct=Math.min(100,Math.round(expTotal()/state.budget*100));const cats=expCats(),maxcat=cats[0]?.[1]||1;return `<div class="page-kicker"><span>2026년 10월 31일 · 토요일</span><span class="signal">개인 가계부 · 데모</span></div><section class="overview-hero"><div class="hero-left"><div class="hero-eyebrow">전체 자산</div><h1 class="balance-number">${fmt(balance())}<small>원</small></h1><div class="delta"><span class="asset-chip">${state.accounts.length}개 계좌 합산</span><span>수입 · 지출 · 이체 반영</span></div><div class="action-row"><button class="btn-primary" onclick="openSheet('expense')">${ico('plus')} 내역 추가</button><button class="btn-secondary" onclick="openSheet('transfer')">${ico('swap')} 계좌 이체</button></div></div>${heroChart()}</section><div class="section-space"></div><div class="grid-body"><section class="surface"><div class="section-heading"><h2 class="section-title">내 계좌</h2><button class="link-btn" onclick="go('assets')">모두 보기 ${ico('chevron')}</button></div>${accountRows(3)}</section><section class="surface"><div class="section-heading"><h2 class="section-title">이번 달</h2><button class="link-btn" onclick="go('budget')">예산 관리 ${ico('chevron')}</button></div><div class="spend-wrap"><div class="spend-overline">총 지출</div><div class="spend-num">${fmt(expTotal())}<small>원</small></div><div class="spend-compare"><b>${pct}%</b> 사용했어요 · 월 예산 ${fmt(state.budget)}원</div><div class="budget-head"><span>이번 달 예산</span><strong>${remain()>=0?'남은 '+fmt(remain())+'원':'초과 '+fmt(-remain())+'원'}</strong></div><div class="progress"><span style="width:${pct}%"></span></div><div class="categories">${(cats.length?cats:[['식비',3],['쇼핑',2],['고정비',1],['카페',.5]]).slice(0,5).map(([name,n])=>`<span title="${escapeHTML(name)}" class="catbar" style="flex:${Math.max(.1,n)};height:${Math.max(14,Math.round(n/maxcat*100))}%"></span>`).join('')}</div><div class="catlegend"><span>카테고리별 지출</span><span>${cats.length}개 카테고리</span></div></div></section></div><div class="overview-bottom"><section class="surface"><div class="section-heading"><h2 class="section-title">최근 거래</h2><button class="link-btn" onclick="go('transactions')">전체 내역 ${ico('chevron')}</button></div><div class="transaction-list">${txRows([...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),5)}</div></section><section class="surface bottom-aside"><div><span class="note-mark">${ico('sparkle')}</span><h2 class="note-title">이번 달 지출,<br>한눈에 살펴보기</h2><p class="note-copy">가장 많이 사용한 항목부터<br>예산까지, 필요한 숫자만 정리했어요.</p></div><button class="note-action" onclick="go('insights')">소비 자세히 보기 ${ico('arrow')}</button></section></div>`}
function pageHeader(title,sub){return `<div class="subpage-intro"><div class="eyebrow">YOUR MONEY, CLEARLY.</div><h1>${title}</h1><p>${sub}</p></div>`}
function transactions(){let items=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).filter(t=>(txFilter==='all'||txFilter===t.type)&&(!txQuery||`${t.name} ${t.category} ${nameAccount(t.account)}`.toLowerCase().includes(txQuery.toLowerCase())));return `${pageHeader('거래 내역','돈이 오간 순간을 빠짐없이 확인해요.')}<div class="subpage-layout"><section class="surface"><div class="section-heading"><h2 class="section-title">전체 기록</h2><button class="link-btn" onclick="openSheet('expense')">${ico('plus')} 추가하기</button></div><div class="field-search">${ico('search')}<input id="txSearch" aria-label="거래 검색" placeholder="거래명, 카테고리 검색" value="${escapeHTML(txQuery)}" oninput="txQuery=this.value;document.getElementById('txResult').innerHTML=txRows(filteredItems());"></div><div class="minitabs">${[['all','전체'],['expense','지출'],['income','수입'],['transfer','이체']].map(([key,label])=>`<button class="${txFilter===key?'active':''}" onclick="txFilter='${key}';render()">${label}</button>`).join('')}</div><div id="txResult">${txRows(items)}</div></section><aside class="surface"><div class="section-heading"><h2 class="section-title">10월 한눈에</h2></div><div class="page-balance"><span>이번 달 수입</span><strong>+ ${fmt(incTotal())}원</strong></div><div class="stat-panel"><div class="sub-muted">이번 달 지출</div><div class="stat-big">${fmt(expTotal())}원</div><div class="sub-muted">이체는 수입·지출 계산에서 제외돼요.</div></div></aside></div>`}

function parseFinanceMessage(text) {
  if (!text || typeof text !== 'string') return null;

  // 1. Amount
  let amount = 0;
  const amtMatch = text.match(/([0-9,]+)\s*원/) || text.match(/(?:출금|결제|승인|송금)\s*([0-9,]+)/);
  if (amtMatch) {
    amount = Number(amtMatch[1].replace(/,/g, ''));
  }

  // 2. Time extraction (e.g. 12:30, 14:20, 09:05)
  let time = getCurrentTimeStr();
  const timeMatch = text.match(/(\d{1,2}:\d{2})/);
  if (timeMatch) {
    const parts = timeMatch[1].split(':');
    time = String(parts[0]).padStart(2, '0') + ':' + parts[1];
  }

  // 3. Type
  let type = 'expense';
  if (text.includes('입금') || text.includes('취소')) {
    type = 'income';
  } else if (text.includes('이체') || text.includes('송금')) {
    type = 'transfer';
  }

  // 4. Account
  let account = 'toss';
  if (text.includes('카카오') || text.includes('카뱅')) account = 'kakao';
  else if (text.includes('현금') || text.includes('지갑')) account = 'cash';

  // 5. Category & Merchant
  let category = '기타';
  let merchant = '';

  const catKeywords = {
    '카페': ['스타벅스', '투썸', '이디야', '메가커피', '컴포즈', '빽다방', '커피', '카페'],
    '식비': ['우아한형제', '배달의민족', '요기요', '쿠팡이츠', '식당', '버거킹', '맥도날드', '김밥', '밥', '삼겹', '식사'],
    '편의점': ['GS25', 'CU', '세븐일레븐', '이마트24', '편의점'],
    '교통': ['티머니', '지하철', '버스', '택시', '카카오T', '코레일', 'KTX', '주유'],
    '쇼핑': ['쿠팡', '네이버페이', '마켓컬리', '올리브영', '다이소', '무신사', '지마켓', '11번가', '백화점', '마트']
  };

  for (const [cat, words] of Object.entries(catKeywords)) {
    for (const w of words) {
      if (text.includes(w)) {
        category = cat;
        merchant = w;
        break;
      }
    }
    if (category !== '기타') break;
  }

  if (!merchant) {
    const mMatch = text.match(/(?:결제|승인|이용|출금)\s*(?::\s*)?([가-힣a-zA-Z0-9\(\)]+)/) ||
                   text.match(/([가-힣a-zA-Z0-9]+(?:점|마트|점포|식당|카페|치킨|스토어))/);
    if (mMatch) merchant = mMatch[1];
  }

  return { amount, time, type, account, category, name: merchant || category };
}

async function smartClipboardParse() {
  const box = document.getElementById('smartPasteBox');
  const txtArea = document.getElementById('smartPasteText');

  // Try reading clipboard automatically
  try {
    if (navigator.clipboard && navigator.clipboard.readText) {
      const clipText = await navigator.clipboard.readText();
      if (clipText && (clipText.includes('원') || clipText.includes('승인') || clipText.includes('출금') || clipText.includes('결제'))) {
        applyParsedData(clipText);
        toast('📋 클립보드 금융 문자를 자동 인식했어요! ✨');
        return;
      }
    }
  } catch(e) {}

  // If clipboard not directly available, toggle paste box
  if (box) {
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
    if (txtArea) txtArea.focus();
  }
}

function applyParsedData(rawText) {
  const parsed = parseFinanceMessage(rawText);
  if (!parsed || !parsed.amount) return;

  // Set type tab
  if (parsed.type && parsed.type !== currentSheet) {
    openSheet(parsed.type);
  }

  // Set amount
  const amtInp = document.getElementById('entryAmount');
  if (amtInp) amtInp.value = parsed.amount;

  // Set category
  const catSel = document.getElementById('entryCategory');
  if (catSel) catSel.value = parsed.category;

  // Set account
  const accSel = document.getElementById('entryAccount');
  if (accSel && parsed.account) accSel.value = parsed.account;

  // Set name
  const nameInp = document.getElementById('entryName');
  if (nameInp && parsed.name) nameInp.value = parsed.name;

  toast(`💡 ${parsed.name} ${Number(parsed.amount).toLocaleString()}원 자동 완성!`);
}

function parseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  text=String(text||'').replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}
    else if(ch==='"')quoted=true;
    else if(ch===','){row.push(cell.trim());cell=''}
    else if(ch==='\n'){row.push(cell.trim().replace(/\r$/,''));if(row.some(Boolean))rows.push(row);row=[];cell=''}
    else cell+=ch
  }
  row.push(cell.trim().replace(/\r$/,''));if(row.some(Boolean))rows.push(row);return rows
}
function importExcelTransactions(event){
  const file=event.target.files?.[0];event.target.value='';if(!file)return;
  if(!file.name.toLowerCase().endsWith('.csv')){toast('엑셀에서 CSV UTF-8 형식으로 저장해 주세요');return}
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const rows=parseCSV(reader.result);if(rows.length<2)throw new Error('입력할 거래가 없어요');
      const expected=['유형','금액','거래내용','카테고리','계좌','받는계좌','날짜','시간'];
      const header=rows[0].map(x=>x.replace(/\s/g,''));if(expected.some((x,i)=>header[i]!==x))throw new Error('MOA 양식의 열 제목을 변경하지 말아 주세요');
      const imported=[];const errors=[];
      rows.slice(1).forEach((r,index)=>{
        const line=index+2,typeMap={지출:'expense',수입:'income',이체:'transfer',expense:'expense',income:'income',transfer:'transfer'};
        const type=typeMap[(r[0]||'').toLowerCase()]||typeMap[r[0]],amount=Number(String(r[1]||'').replaceAll(',',''));
        const account=state.accounts.find(a=>a.id===r[4]||a.name===r[4]);const to=state.accounts.find(a=>a.id===r[5]||a.name===r[5]);
        const date=r[6],time=(r[7]||'').trim();
        if(!type||!Number.isFinite(amount)||amount<=0||!account||!/^\d{4}-\d{2}-\d{2}$/.test(date)||(time&&!/^\d{2}:\d{2}$/.test(time))||(type==='transfer'&&(!to||to.id===account.id))){errors.push(line);return}
        imported.push({id:Date.now()+index,type,amount:Math.round(amount),name:(r[2]||r[3]||(type==='transfer'?'계좌 이체':'거래')).trim(),category:type==='transfer'?'이체':(r[3]||'기타').trim(),account:account.id,...(type==='transfer'?{to:to.id}:{}),date,...(time?{time}:{})})
      });
      if(!imported.length)throw new Error(errors.length?`${errors.join(', ')}행을 확인해 주세요`:'입력할 거래가 없어요');
      imported.forEach(tx=>{const from=state.accounts.find(a=>a.id===tx.account);if(tx.type==='expense')from.balance-=tx.amount;else if(tx.type==='income')from.balance+=tx.amount;else{from.balance-=tx.amount;state.accounts.find(a=>a.id===tx.to).balance+=tx.amount}});
      state.transactions.unshift(...imported);store();closeSheet();render();toast(`${imported.length}개 거래를 불러왔어요${errors.length?` · ${errors.length}개 행 제외`:''}`)
    }catch(err){toast(err.message||'파일을 불러오지 못했어요')}
  };
  reader.onerror=()=>toast('파일을 읽지 못했어요');reader.readAsText(file,'utf-8')
}

// In-app Updater
const MOA_APP_VERSION = '1.2.0';
function compareVersions(a, b) {
  const left = String(a || '').split('.').map(Number);
  const right = String(b || '').split('.').map(Number);
  const length = Math.max(left.length, right.length);
  for (let i = 0; i < length; i++) {
    const diff = (left[i] || 0) - (right[i] || 0);
    if (diff) return diff;
  }
  return 0;
}
async function getLatestAppInfo() {
  const res = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('업데이트 정보 조회 실패');
  return res.json();
}
async function downloadLatestApp() {
  try {
    const info = await getLatestAppInfo();
    window.open(info.apkUrl || info.downloadUrl, '_blank', 'noopener');
  } catch (e) {
    toast('앱 다운로드 링크를 불러오지 못했어요');
  }
}
async function checkForUpdates(manual = false) {
  try {
    const info = await getLatestAppInfo();
    const isNew = info.version && compareVersions(info.version, MOA_APP_VERSION) > 0;
    const badge = document.getElementById('updateDot');
    if (badge) badge.style.display = isNew ? 'block' : 'none';

    if (manual) {
      if (isNew) {
        if (confirm('새로운 v' + info.version + ' 버전이 나왔어요! 업데이트할까요?')) {
          window.open(info.apkUrl || info.downloadUrl, '_blank');
        }
      } else {
        toast('현재 최신 버전(v' + MOA_APP_VERSION + ')을 사용하고 있어요');
      }
    }
  } catch(e) {
    if (manual) toast('업데이트 확인 실패: ' + e.message);
  }
}

function copyAutoUrl() {
  const url = window.location.origin + window.location.pathname + '?msg={notification_text}';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url);
    toast('연동 URL이 복사되었어요!');
  } else {
    prompt('연동 URL을 복사해 주세요:', url);
  }
}

function simulateAutoImport() {
  const sampleMsg = '[카카오뱅크] 10/31 15:30 14,000원 출금 (체크카드 결제: 배달의민족)';
  closeSheet();
  const parsed = parseFinanceMessage(sampleMsg);
  if (parsed) {
    lastSnapshot = clone(state);
    let tx = {
      id: Date.now(),
      type: 'expense',
      amount: parsed.amount,
      date: new Date().toISOString().slice(0, 10),
      category: parsed.category,
      account: parsed.account,
      name: parsed.name
    };
    const acc = state.accounts.find(a => a.id === tx.account) || state.accounts[0];
    acc.balance -= tx.amount;
    state.transactions.unshift(tx);
    store();
    render();
    showSnackbar(`[카카오뱅크 자동연동] ${tx.name} ${fmt(tx.amount)}원 기록 완료! 🎉`, true);
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});render();
