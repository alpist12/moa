:root{--bg:#ffffff;--ink:#171b25;--line:#e9edf2;--blue:#1769f4}
body{background:#fff}
.topbar{height:76px;background:rgba(255,255,255,.97)}
.top-inner{max-width:1290px}
.logo{letter-spacing:-.105em;font-size:30px}
.logo-dot{color:#2576ff}
.header-add{background:#1769f4;border-radius:10px}
.header-add:hover{background:#0953d4}
.header-right .roundbtn{background:#f5f7f9}
.shell{max-width:1290px;padding:46px 44px 110px}
.page-kicker{font-weight:650;color:#99a1ae;margin-bottom:30px}
.page-kicker .signal{color:#a0a7b1}
.overview-hero{background:none;border-radius:0;min-height:310px;padding:20px 0 39px;grid-template-columns:1.08fr .92fr;gap:76px;border-bottom:1px solid var(--line)}
.hero-left{justify-content:center}

.balance-number{font-size:clamp(49px,5.2vw,78px);font-weight:850;letter-spacing:-.083em}
.delta{margin-top:15px;color:#9aa3b0;font-size:12px}
.asset-chip{font-size:11px;background:#eef5ff;color:#3078e9;padding:6px 10px;border-radius:8px;font-weight:750}
.action-row{margin-top:34px}
.btn-primary{background:#1769f4;border-radius:11px}
.btn-primary:hover{background:#0856d7}
.btn-secondary{border-radius:11px;background:#f3f5f7}
.chart-visual{min-height:190px}
.trend-bubble{color:#1c6ef0}
.section-space{height:48px}

<script>
const UI={home:'홈',transactions:'내역',calendar:'달력',assets:'자산',budget:'예산',insights:'분석'};
const iconShapes={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',transactions:'<path d="M5 5h14M5 12h14M5 19h14"/><circle cx="3" cy="5" r=".7" fill="currentColor"/><circle cx="3" cy="12" r=".7" fill="currentColor"/><circle cx="3" cy="19" r=".7" fill="currentColor"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',assets:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M7 16h3"/>',budget:'<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 5"/>',insights:'<path d="m4 17 5-5 3 3 8-8M15 7h5v5"/>',chevron:'<path d="m9 18 6-6-6-6"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',swap:'<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',coffee:'<path d="M4 8h12v7a6 6 0 0 1-12 0V8ZM16 9h2a3 3 0 0 1 0 6h-2M3 21h15"/>',bag:'<path d="M5 8h14l-1 13H6L5 8ZM9 8V6a3 3 0 0 1 6 0v2"/>',meal:'<path d="M4 3v8a3 3 0 0 0 6 0V3M7 3v18M17 3c-3 4-3 8 0 11v7M4 7h6"/>',bus:'<rect x="5" y="3" width="14" height="17" rx="3"/><path d="M5 12h14M8 17h2m4 0h2M8 20v2m8-2v2"/>',film:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M7 5l3 5m2-5 3 5m2-5 3 5"/>',wallet:'<rect x="3" y="6" width="18" height="15" rx="3"/><path d="M3 10h18M16 15h2"/>',income:'<path d="M12 3v15m-6-6 6 6 6-6M5 21h14"/>',transfer:'<path d="M4 7h16m-5-4 5 4-5 4M20 17H4m5-4-5 4 5 4"/>',close:'<path d="M5 5 19 19M19 5 5 19"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',sparkle:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/>',shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m8 12 3 3 5-5"/>',cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>'};
const ico=(name,cls='')=>`<svg aria-hidden="true" class="icon ${cls}" viewBox="0 0 24 24">${iconShapes[name]||iconShapes.wallet}</svg>`;
const fmt=n=>Math.abs(n).toLocaleString('ko-KR'), money=n=>`${n<0?'-':''}${fmt(n)}원`;
const todayStr='2026-10-31';
const initial={accounts:[{id:'toss',name:'토스뱅크',sub:'입출금 통장',balance:1420000,type:'toss'},{id:'kakao',name:'카카오뱅크',sub:'저축 통장',balance:2850000,type:'kakao'},{id:'cash',name:'현금',sub:'지갑',balance:80000,type:'cash'}],transactions:[{id:1,type:'expense',date:'2026-10-31',name:'오후의 커피',category:'카페',account:'toss',amount:5900},{id:2,type:'expense',date:'2026-10-30',name:'점심 식사',category:'식비',account:'toss',amount:13200},{id:3,type:'expense',date:'2026-10-29',name:'시내버스',category:'교통',account:'toss',amount:1650},{id:4,type:'transfer',date:'2026-10-28',name:'저축 통장으로 이동',category:'이체',account:'toss',to:'kakao',amount:300000},{id:5,type:'expense',date:'2026-10-27',name:'영화관',category:'문화',account:'toss',amount:14500},{id:6,type:'expense',date:'2026-10-24',name:'이번 주 장보기',category:'식비',account:'kakao',amount:53600},{id:7,type:'expense',date:'2026-10-23',name:'온라인 쇼핑',category:'쇼핑',account:'toss',amount:43800},{id:8,type:'expense',date:'2026-10-20',name:'휴대폰 요금',category:'고정비',account:'toss',amount:59000},{id:9,type:'expense',date:'2026-10-18',name:'친구들과 저녁',category:'식비',account:'toss',amount:63500},{id:10,type:'expense',date:'2026-10-15',name:'카페',category:'카페',account:'toss',amount:8300},{id:11,type:'expense',date:'2026-10-13',name:'편의점',category:'식비',account:'toss',amount:9800},{id:12,type:'expense',date:'2026-10-10',name:'생필품',category:'쇼핑',account:'kakao',amount:55000},{id:13,type:'expense',date:'2026-10-08',name:'온라인 구독',category:'고정비',account:'toss',amount:14900},{id:14,type:'expense',date:'2026-10-06',name:'외식',category:'식비',account:'toss',amount:43800},{id:15,type:'income',date:'2026-10-05',name:'급여',category:'월급',account:'toss',amount:2400000}],budget:800000};
const clone = x => { try { return structuredClone(x); } catch(e) { return JSON.parse(JSON.stringify(x)); } };
let state;
try { state = JSON.parse(localStorage.getItem('moa_editorial_v4') || 'null'); } catch(e) { state = null; }
if (!state || !Array.isArray(state.accounts) || !Array.isArray(state.transactions) || typeof state.budget !== 'number') {
  state = clone(initial);
  try { localStorage.setItem('moa_editorial_v4', JSON.stringify(state)); } catch(e) {}
}
let view='home', txFilter='all', txQuery='', focusDate='2026-10-31', calendarMonth=9, calendarYear=2026, chartPeriod='1개월', currentSheet='expense';
let store=()=>{try{localStorage.setItem('moa_editorial_v4',JSON.stringify(state))}catch(e){}};
const balance=()=>state.accounts.reduce((n,a)=>n+a.balance,0);
const monthItems=()=>state.transactions.filter(t=>t.date.slice(0,7)==='2026-10');
const expTotal=()=>monthItems().filter(t=>t.type==='expense').reduce((sum,t)=>sum+t.amount,0);
const incTotal=()=>monthItems().filter(t=>t.type==='income').reduce((sum,t)=>sum+t.amount,0);
const remain=()=>state.budget-expTotal();
const expCats=()=>{const o={};monthItems().filter(t=>t.type==='expense').forEach(t=>o[t.category]=(o[t.category]||0)+t.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1]);};
const nameAccount=id=>state.accounts.find(a=>a.id===id)?.name||'계좌';
const escapeHTML=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const symbol=a=>`<span class="bank-symbol ${a.type==='toss'||a.type==='kakao'||a.type==='cash'?a.type:'new'}">${a.type==='toss'?'t':a.type==='kakao'?'K':a.type==='cash'?ico('cash'):ico('wallet')}</span>`;
function nav(){document.getElementById('desktopNav').innerHTML=Object.entries(UI).map(([k,t])=>`<button class="nav-item ${view===k?'active':''}" onclick="go('${k}')" aria-current="${view===k?'page':'false'}">${t}</button>`).join('');let mobileItems=[['home','홈'],['transactions','내역'],['assets','자산'],['insights','분석']];document.getElementById('mobileNav').innerHTML=mobileItems.map(([k,t])=>`<button class="${view===k?'active':''}" onclick="go('${k}')" aria-label="${t}">${ico(k)}<span>${t}</span></button>`).join('')}
function heroChart(){const paths={'1주':'M 0 116 C 45 126 57 58 100 81 S 164 125 206 75 S 285 96 328 41 S 392 80 446 22','1개월':'M 0 138 C 36 137 45 128 74 124 S 127 94 159 107 S 209 85 240 90 S 308 48 335 56 S 392 72 446 21','3개월':'M 0 147 C 44 128 61 156 90 116 S 152 138 190 86 S 236 97 278 61 S 346 89 382 42 S 417 45 446 17'};let path=paths[chartPeriod];let area=path+' L 446 175 L 0 175 Z';return `<div class="hero-chart-area"><div class="chart-head"><span class="chart-title">자산 흐름 <span style="color:#a8aeb7;font-weight:600">· 예시 추이</span></span><div class="time-filter">${['1주','1개월','3개월'].map(p=>`<button class="${chartPeriod===p?'chosen':''}" onclick="chartPeriod='${p}';render()">${p}</button>`).join('')}</div></div><div class="chart-visual"><span class="trend-bubble">↗ 2.8%</span><svg viewBox="0 0 446 175" preserveAspectRatio="none" aria-label="자산 변동 예시 그래프"><defs><linearGradient id="gradientFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#327fff" stop-opacity=".20"/><stop offset="100%" stop-color="#327fff" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#gradientFill)"/><path d="${path}" stroke="#2d80ff" stroke-width="3.7" stroke-linecap="round" fill="none"/><circle cx="446" cy="${chartPeriod==='3개월'?17:chartPeriod==='1주'?22:21}" r="6" fill="#2d80ff" stroke="white" stroke-width="4"/></svg></div><div class="chart-foot"><span>${chartPeriod==='1주'?'10.25':chartPeriod==='1개월'?'10.01':'08.01'}</span><span>${chartPeriod==='1주'?'10.31':chartPeriod==='1개월'?'10.31':'10.31'}</span></div></div>`}
function accountRows(limit=99){return state.accounts.slice(0,limit).map(a=>`<div class="account-row">${symbol(a)}<div class="bank-copy"><div class="row-main">${escapeHTML(a.name)}</div><div class="row-sub">${escapeHTML(a.sub)}</div></div><div class="row-value">${fmt(a.balance)}<small>원</small></div><button class="row-push" aria-label="${escapeHTML(a.name)}에서 이체" onclick="openSheet('transfer','${a.id}')">${ico('chevron')}</button></div>`).join('')}
function txIcon(t){const name=t.type==='transfer'?'transfer':t.type==='income'?'income':({'카페':'coffee','식비':'meal','교통':'bus','쇼핑':'bag','문화':'film','고정비':'wallet'}[t.category]||'wallet');return `<span class="tx-symbol ${t.type==='income'?'income':t.type==='transfer'?'transfer':''}">${ico(name)}</span>`}
function txRows(items,limit=100){return items.slice(0,limit).map(t=>`<div class="tx-row">${txIcon(t)}<div class="tx-copy"><div class="row-main">${escapeHTML(t.name)}</div><div class="row-sub">${escapeHTML(t.type==='transfer'?nameAccount(t.account)+' → '+nameAccount(t.to):t.category+' · '+nameAccount(t.account))}</div></div><div><div class="tx-amount ${t.type}">${t.type==='transfer'?'이체 ':t.type==='income'?'+':'−'}${fmt(t.amount)}원</div><div class="tx-date">${t.date.slice(5).replace('-','.')}</div></div></div>`).join('')||'<div class="empty">거래 내역이 없어요.</div>'}
function home(){const pct=Math.min(100,Math.round(expTotal()/state.budget*100));const cats=expCats(),maxcat=cats[0]?.[1]||1;return `<div class="page-kicker"><span>2026년 10월 31일 · 토요일</span><span class="signal">개인 가계부 · 데모</span></div><section class="overview-hero"><div class="hero-left"><div class="hero-eyebrow">전체 자산</div><h1 class="balance-number">${fmt(balance())}<small>원</small></h1><div class="delta"><span class="asset-chip">${state.accounts.length}개 계좌 합산</span><span>수입 · 지출 · 이체 반영</span></div><div class="action-row"><button class="btn-primary" onclick="openSheet('expense')">${ico('plus')} 내역 추가</button><button class="btn-secondary" onclick="openSheet('transfer')">${ico('swap')} 계좌 이체</button></div></div>${heroChart()}</section><div class="section-space"></div><div class="grid-body"><section class="surface"><div class="section-heading"><h2 class="section-title">내 계좌</h2><button class="link-btn" onclick="go('assets')">모두 보기 ${ico('chevron')}</button></div>${accountRows(3)}</section><section class="surface"><div class="section-heading"><h2 class="section-title">이번 달</h2><button class="link-btn" onclick="go('budget')">예산 관리 ${ico('chevron')}</button></div><div class="spend-wrap"><div class="spend-overline">총 지출</div><div class="spend-num">${fmt(expTotal())}<small>원</small></div><div class="spend-compare"><b>${pct}%</b> 사용했어요 · 월 예산 ${fmt(state.budget)}원</div><div class="budget-head"><span>이번 달 예산</span><strong>${remain()>=0?'남은 '+fmt(remain())+'원':'초과 '+fmt(-remain())+'원'}</strong></div><div class="progress"><span style="width:${pct}%"></span></div><div class="categories">${(cats.length?cats:[['식비',3],['쇼핑',2],['고정비',1],['카페',.5]]).slice(0,5).map(([name,n])=>`<span title="${escapeHTML(name)}" class="catbar" style="flex:${Math.max(.1,n)};height:${Math.max(14,Math.round(n/maxcat*100))}%"></span>`).join('')}</div><div class="catlegend"><span>카테고리별 지출</span><span>${cats.length}개 카테고리</span></div></div></section></div><div class="overview-bottom"><section class="surface"><div class="section-heading"><h2 class="section-title">최근 거래</h2><button class="link-btn" onclick="go('transactions')">전체 내역 ${ico('chevron')}</button></div><div class="transaction-list">${txRows([...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),5)}</div></section><section class="surface bottom-aside"><div><span class="note-mark">${ico('sparkle')}</span><h2 class="note-title">이번 달 지출,<br>한눈에 살펴보기</h2><p class="note-copy">가장 많이 사용한 항목부터<br>예산까지, 필요한 숫자만 정리했어요.</p></div><button class="note-action" onclick="go('insights')">소비 자세히 보기 ${ico('arrow')}</button></section></div>`}

function saveEntry(e){e.preventDefault();const amt=Math.round(Number(document.getElementById('entryAmount').value)),date=document.getElementById('entryDate').value;if(!Number.isFinite(amt)||amt<=0||!date){toast('금액과 날짜를 확인해 주세요');return}let tx={id:Date.now(),type:currentSheet,amount:amt,date};if(currentSheet==='transfer'){const from=document.getElementById('entryFrom').value,to=document.getElementById('entryTo').value;if(from===to){toast('서로 다른 계좌를 선택해 주세요');return}const a=state.accounts.find(x=>x.id===from),b=state.accounts.find(x=>x.id===to);if(a.balance<amt){toast('보내는 계좌의 잔액이 부족해요');return}a.balance-=amt;b.balance+=amt;tx.account=from;tx.to=to;tx.category='이체';tx.name=document.getElementById('transferName').value.trim()||'계좌 이체'}else{const id=document.getElementById('entryAccount').value,a=state.accounts.find(x=>x.id===id);if(currentSheet==='expense'&&a.balance<amt){toast('출금 계좌의 잔액이 부족해요');return}a.balance+=currentSheet==='income'?amt:-amt;tx.account=id;tx.category=document.getElementById('entryCategory').value;tx.name=document.getElementById('entryName').value.trim()||tx.category}state.transactions.unshift(tx);store();closeSheet();render();toast(currentSheet==='transfer'?'이체했어요. 총자산은 그대로예요.':'거래가 저장됐어요')}

const CURRENT_VERSION = '1.1.0';
let authUser = null;
let latestUpdateInfo = null;

// Service Worker & Notifications
if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

function checkDailyReminder() {
  try {
    const now = new Date();
    const today = now.toISOString().slice(0, 10);
    const key = 'moa_remind_' + today;
    if (now.getHours() >= 20 && !localStorage.getItem(key)) {
      const hasToday = (state.transactions || []).some(t => t.date === today);
      if (!hasToday) {
        localStorage.setItem(key, '1');
        sendNotification('오늘 쓴 용돈 기록하기 📝', '오늘 쓴 지출을 잊지 말고 기록해 보세요!');
      }
    }
  } catch(e) {}
}

function sendNotification(title, body) {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'SHOW_NOTIFICATION', title, body });
    } else {
      new Notification(title, { body, icon: './moa-icon.png' });
    }
  } catch(e) {}
}

async function requestNotif() {
  if (typeof Notification === 'undefined') {
    toast('이 브라우저/기기는 알림 기능을 지원하지 않아요.');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    toast('🔔 알림이 켜졌어요! 매일 저녁 리마인더와 업데이트를 보내드려요.');
    sendNotification('MOA 알림 활성화', '매일 저녁 용돈 기록 알림을 보내드려요!');
  } else {
    toast('알림 권한이 허용되지 않았어요.');
  }
}

// Google Auth Sync Integration
function updateAuthUI(connected, name) {
  const dot = document.getElementById('authDot');
  const text = document.getElementById('authText');
  const avatar = document.getElementById('userAvatar');
  if (dot) dot.className = 'auth-dot' + (connected ? ' connected' : '');
  if (text) text.textContent = connected ? '동기화 됨' : 'Google 로그인';
  if (avatar) avatar.textContent = connected ? (name ? name.slice(0, 1).toUpperCase() : '✓') : '나';
}

window.addEventListener('moa-drive-change', ev => {
  if (ev && ev.detail) {
    const { connected, name, message } = ev.detail;
    authUser = connected ? (name || '사용자') : null;
    updateAuthUI(connected, name);
    if (message && message.includes('실패')) toast(message);
  }
});

function triggerGoogleAuth() {
  if (window.moaDrive && window.moaDrive.connect) {
    window.moaDrive.connect();
  } else {
    toast('Google 동기화 모듈을 불러오는 중이에요. 잠시 후 다시 눌러주세요.');
  }
}

// Auto sync on state change
const origStore = store;
store = function() {
  origStore();
  if (window.moaDrive && window.moaDrive.saveNow) {
    window.moaDrive.saveNow();
  }
};

// In-app Updater
async function checkForUpdates(manual = false) {
  try {
    const res = await fetch('./version.json?t=' + Date.now());
    if (!res.ok) throw new Error('업데이트 정보를 불러오지 못했어요.');
    const info = await res.json();
    latestUpdateInfo = info;
    const isNew = info.version && info.version !== CURRENT_VERSION;
    const badge = document.getElementById('updateDot');
    if (badge) badge.style.display = isNew ? 'block' : 'none';

    if (isNew) {
      if (manual) openUpdateModal(info, true);
      else sendNotification('MOA 새 업데이트 출시! 🚀', 'v' + info.version + ' 버전이 나왔어요. 탭하여 확인해 보세요!');
    } else if (manual) {
      openUpdateModal(info, false);
      toast('🎉 현재 최신 버전(v' + CURRENT_VERSION + ')을 사용하고 있어요!');
    }
  } catch(e) {
    if (manual) toast('업데이트 확인 실패: ' + e.message);
  }
}

function openUpdateModal(info, hasUpdate) {
  const root = document.getElementById('dialogRoot');
  root.innerHTML = `<div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="업데이트"><span class="sheet-handle"></span><div class="sheet-top"><h2>${hasUpdate ? '🚀 새 버전 업데이트' : '🎉 최신 버전 이용 중'}</h2><button onclick="closeSheet()" aria-label="닫기">${ico('close')}</button></div><div style="background:#f4f7fc;border-radius:15px;padding:16px;margin:20px 0 16px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:#1769f4;margin-bottom:6px"><span>현재 버전: v${CURRENT_VERSION}</span><span>최신 버전: v${info.version}</span></div><div class="sub-muted">배포일: ${info.releaseDate || '2026-10-31'}</div></div><div style="margin-bottom:24px"><div class="form-label">업데이트 변경사항</div><div style="background:#f8f9fb;border-radius:12px;padding:14px;font-size:12.5px;color:#4b5563;line-height:1.7;white-space:pre-wrap">${info.notes || '안정성 개선 및 버그 수정'}</div></div>${hasUpdate ? `<button class="submit-btn" style="margin-top:0;margin-bottom:9px" onclick="window.open('${info.apkUrl || info.downloadUrl}','_blank')">📱 최신 APK 다운로드 (안드로이드)</button><button class="btn-secondary" style="width:100%" onclick="location.reload(true)">🔄 웹앱 새로고침하여 즉시 적용</button>` : `<button class="submit-btn" style="margin-top:0" onclick="closeSheet()">확인</button>`}</section></div>`;
  document.body.style.overflow = 'hidden';
}

// Enhance openSettings
const origOpenSettings = openSettings;
openSettings = function() {
  const root = document.getElementById('dialogRoot');
  root.innerHTML = `<div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="설정"><span class="sheet-handle"></span><div class="sheet-top"><h2>설정 및 정보</h2><button onclick="closeSheet()" aria-label="닫기">${ico('close')}</button></div><div style="margin:20px 0 16px;background:#f5f7fa;border-radius:15px;padding:16px"><div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:14px">MOA 앱 버전</strong><span class="sub-muted">v${CURRENT_VERSION}</span></div></div><div style="display:flex;flex-direction:column;gap:9px;margin-bottom:20px"><button class="btn-secondary" onclick="triggerGoogleAuth()">${authUser ? 'Google 계정 로그아웃 / 계정 변경' : 'Google 로그인으로 클라우드 동기화'}</button><button class="btn-secondary" onclick="requestNotif()">🔔 매일 저녁 지출 리마인더 알림 켜기</button><button class="btn-secondary" onclick="checkForUpdates(true)">⚡ 새 업데이트 확인하기</button><button class="btn-secondary" onclick="window.open('https://github.com/alpist12/moa/releases','_blank')">📱 최신 안드로이드 APK 다운로드 페이지</button></div><button class="btn-secondary" style="width:100%;color:#f15c5c" onclick="if(confirm('시연 데이터를 초기화할까요?')){state=clone(initial);store();closeSheet();go('home');toast('시연 데이터를 초기화했어요')}">시연 데이터 초기화</button></section></div>`;
  document.body.style.overflow = 'hidden';
};

setTimeout(() => {
  checkForUpdates(false);
  checkDailyReminder();
}, 2000);

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});render();
</script>
</body></html>
