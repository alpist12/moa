name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Install Capacitor & Add Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moa-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: MOA ${{ github.ref_name || 'Latest Release' }}
          body: |
            ## 📱 MOA 안드로이드 앱 최신 업데이트
            - 인앱 업데이트 확인 및 자동 다운로드 지원
            - 가계부 리마인더 푸시 알림
            - 최신 APK 파일을 다운로드하여 스마트폰에 설치할 수 있습니다.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
