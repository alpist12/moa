name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies & Build Web App
        run: |
          npm ci
          npm run build

      - name: Sync Android Platform
        run: |
          npx cap sync android

      - name: Restore release signing key
        env:
          MOA_KEYSTORE_BASE64: ${{ secrets.MOA_KEYSTORE_BASE64 }}
        run: echo "$MOA_KEYSTORE_BASE64" | base64 --decode > android/app/moa-release-v2.jks

      - name: Build signed Android APK
        env:
          MOA_STORE_PASSWORD: ${{ secrets.MOA_STORE_PASSWORD }}
          MOA_KEY_PASSWORD: ${{ secrets.MOA_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease
          cp app/build/outputs/apk/release/app-release.apk ../moa-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moa-app-apk
          path: moa-app.apk

      - name: Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: moa-app.apk
          name: MOA ${{ github.ref_name || 'Latest Release' }}
          body: |
            ## 📱 MOA 안드로이드 앱 최신 업데이트
            - 인앱 업데이트 확인 및 자동 다운로드 지원
            - 가계부 리마인더 푸시 알림
            - 최신 APK 파일을 다운로드하여 스마트폰에 설치할 수 있습니다.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
